<script>

  /* =========================================================
     CONFIGURACIÓN GENERAL
     ========================================================= */

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;


  /* =========================================================
     TAMAÑO DEL MUNDO
     ========================================================= */

  const WORLD_WIDTH = 2400;
  const WORLD_HEIGHT = 1600;

  let screenWidth = window.innerWidth;
  let screenHeight = window.innerHeight;


  function resizeCanvas() {

    screenWidth = window.innerWidth;
    screenHeight = window.innerHeight;

    canvas.width = screenWidth;
    canvas.height = screenHeight;

    ctx.imageSmoothingEnabled = false;
  }


  window.addEventListener("resize", resizeCanvas);

  resizeCanvas();


  /* =========================================================
     CÁMARA
     ========================================================= */

  const camera = {
    x: 0,
    y: 0
  };


  /* =========================================================
     PERSONAJE
     ========================================================= */

  const player = {

    x: 430,
    y: 1050,

    width: 38,
    height: 50,

    speed: 4,

    direction: "down",

    moving: false,

    animationTimer: 0,
    animationFrame: 0
  };


  /* =========================================================
     TECLAS
     ========================================================= */

  const keys = {

    up: false,
    down: false,
    left: false,
    right: false
  };


  /*
   * Detener completamente el movimiento.
   *
   * Esto se utiliza cuando abrimos el inventario
   * para asegurarnos de que ninguna tecla o control
   * táctil que estuviera activo siga moviendo al jugador.
   */

  function stopPlayerMovement() {

    keys.up = false;
    keys.down = false;
    keys.left = false;
    keys.right = false;

    player.moving = false;
  }


  window.addEventListener("keydown", function(event) {

    /*
     * Si estamos hablando,
     * no permitimos movimiento.
     */

    if (dialogueActive) {

      if (
        event.key.toLowerCase() === "e" ||
        event.key === " "
      ) {

        if (!event.repeat) {

          advanceDialogue();
        }

        event.preventDefault();
      }

      return;
    }


    /* =========================
       TECLA I · INVENTARIO
       ========================= */

    if (
      event.key.toLowerCase() === "i" &&
      !event.repeat
    ) {

      toggleInventory();

      event.preventDefault();

      return;
    }


    /*
     * Si el inventario está abierto,
     * bloqueamos completamente el teclado.
     */

    if (inventoryOpen) {

      event.preventDefault();

      return;
    }


    if (
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ) {

      keys.up = true;

      event.preventDefault();
    }


    if (
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ) {

      keys.down = true;

      event.preventDefault();
    }


    if (
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a"
    ) {

      keys.left = true;

      event.preventDefault();
    }


    if (
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ) {

      keys.right = true;

      event.preventDefault();
    }


    /* =========================
       TECLA E
       ========================= */

    if (
      event.key.toLowerCase() === "e" &&
      !event.repeat
    ) {

      interact();
    }

  });


  window.addEventListener("keyup", function(event) {

    if (
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ) {

      keys.up = false;
    }


    if (
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ) {

      keys.down = false;
    }


    if (
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a"
    ) {

      keys.left = false;
    }


    if (
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ) {

      keys.right = false;
    }

  });


  /* =========================================================
     CONTROLES TÁCTILES
     ========================================================= */

  function setupTouchButton(id, direction) {

    const button =
      document.getElementById(id);


    button.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        if (!dialogueActive && !inventoryOpen) {

          keys[direction] = true;
        }

      }
    );


    button.addEventListener(
      "pointerup",
      function(event) {

        event.preventDefault();

        keys[direction] = false;
      }
    );


    button.addEventListener(
      "pointercancel",
      function() {

        keys[direction] = false;
      }
    );


    button.addEventListener(
      "pointerleave",
      function() {

        keys[direction] = false;
      }
    );
  }


  setupTouchButton("up", "up");
  setupTouchButton("down", "down");
  setupTouchButton("left", "left");
  setupTouchButton("right", "right");


  document
    .getElementById("action-button")
    .addEventListener(
      "click",
      interact
    );


  /* =========================================================
     OBSTÁCULOS
     ========================================================= */

  const obstacles = [];


  function addObstacle(
    x,
    y,
    width,
    height
  ) {

    obstacles.push({
      x,
      y,
      width,
      height
    });
  }


  /* =========================
     CASA
     ========================= */

  addObstacle(
    1550,
    310,
    380,
    260
  );


  /* =========================
     LAGO
     ========================= */

  addObstacle(
    1750,
    900,
    500,
    430
  );


  /* =========================
     ÁRBOLES
     ========================= */

  addObstacle(180, 250, 100, 110);
  addObstacle(420, 330, 100, 110);
  addObstacle(690, 190, 100, 110);

  addObstacle(1100, 270, 100, 110);
  addObstacle(1350, 180, 100, 110);

  addObstacle(350, 1350, 100, 110);
  addObstacle(800, 1250, 100, 110);

  addObstacle(1300, 1300, 100, 110);
  addObstacle(1550, 1150, 100, 110);


  /* =========================================================
     OBJETOS INTERACTIVOS
     ========================================================= */

  const interactables = [

    {
      type: "object",
      x: 850,
      y: 820,

      width: 90,
      height: 80,

      text:
        "🌸 Este podría ser uno de los primeros recuerdos de nuestra historia."
    },


    {
      type: "object",
      x: 1500,
      y: 720,

      width: 90,
      height: 90,

      text:
        "💗 Aquí podremos colocar una foto o un recuerdo importante."
    },


    {
      type: "object",
      x: 2100,
      y: 500,

      width: 100,
      height: 100,

      text:
        "✨ Esta zona será importante más adelante..."
    }

  ];


  /* =========================================================
     NPC
     ========================================================= */

  const npcs = [

    {
      type: "npc",
      id: "test-npc",

      name: "???",

      x: 620,
      y: 1020,

      width: 38,
      height: 50,

      dialogues: [

        "Hola...",

        "Si estás viendo esto, significa que llegaste hasta aquí.",

        "Este lugar todavía está empezando a tomar forma.",

        "Pero algún día guardará nuestra historia completa. 💗"

      ]

    }

  ];


  /* =========================================================
     COLISIONES
     ========================================================= */

  function rectanglesCollide(a, b) {

    return (

      a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y

    );
  }


  function canMoveTo(x, y) {

    const futurePlayer = {

      x: x,
      y: y,

      width: player.width,
      height: player.height

    };


    /* Bordes del mundo */

    if (x < 0) return false;

    if (y < 0) return false;

    if (
      x + player.width >
      WORLD_WIDTH
    ) {

      return false;
    }


    if (
      y + player.height >
      WORLD_HEIGHT
    ) {

      return false;
    }


    /* Obstáculos */

    for (
      const obstacle of obstacles
      ) {

      if (
        rectanglesCollide(
          futurePlayer,
          obstacle
        )
      ) {

        return false;
      }

    }


    /* NPCs */

    for (
      const npc of npcs
      ) {

      if (
        rectanglesCollide(
          futurePlayer,
          npc
        )
      ) {

        return false;
      }

    }


    return true;
  }


  /* =========================================================
     MOVIMIENTO
     ========================================================= */

  function updatePlayer() {

    /*
     * No mover al jugador
     * mientras hay diálogo o inventario.
     */

    if (dialogueActive || inventoryOpen) {

      player.moving = false;

      return;
    }


    let dx = 0;
    let dy = 0;


    if (keys.up) {

      dy -= 1;
    }


    if (keys.down) {

      dy += 1;
    }


    if (keys.left) {

      dx -= 1;
    }


    if (keys.right) {

      dx += 1;
    }


    player.moving =
      dx !== 0 ||
      dy !== 0;


    if (!player.moving) {

      return;
    }


    /* Movimiento diagonal */

    if (
      dx !== 0 &&
      dy !== 0
    ) {

      dx *= 0.707;
      dy *= 0.707;
    }


    /* Dirección */

    if (dy < 0) {

      player.direction = "up";

    } else if (dy > 0) {

      player.direction = "down";

    } else if (dx < 0) {

      player.direction = "left";

    } else if (dx > 0) {

      player.direction = "right";
    }


    const newX =
      player.x +
      dx *
      player.speed;


    const newY =
      player.y +
      dy *
      player.speed;


    if (
      canMoveTo(
        newX,
        player.y
      )
    ) {

      player.x = newX;
    }


    if (
      canMoveTo(
        player.x,
        newY
      )
    ) {

      player.y = newY;
    }


    /* Animación */

    player.animationTimer++;


    if (
      player.animationTimer > 8
    ) {

      player.animationTimer = 0;

      player.animationFrame =
        player.animationFrame === 0
          ? 1
          : 0;
    }

  }


  /* =========================================================
     CÁMARA
     ========================================================= */

  function updateCamera() {

    camera.x =
      player.x +
      player.width / 2 -
      screenWidth / 2;


    camera.y =
      player.y +
      player.height / 2 -
      screenHeight / 2;


    camera.x =
      Math.max(
        0,
        Math.min(
          camera.x,
          WORLD_WIDTH -
          screenWidth
        )
      );


    camera.y =
      Math.max(
        0,
        Math.min(
          camera.y,
          WORLD_HEIGHT -
          screenHeight
        )
      );

  }


  /* =========================================================
     FONDO
     ========================================================= */

  function drawBackground() {

    ctx.fillStyle =
      "#82b8d8";


    ctx.fillRect(
      0,
      0,
      screenWidth,
      screenHeight
    );
  }


  /* =========================================================
     TERRENO
     ========================================================= */

  function drawGround() {

    ctx.fillStyle =
      "#6f944b";


    ctx.fillRect(
      -camera.x,
      -camera.y,
      WORLD_WIDTH,
      WORLD_HEIGHT
    );


    /* Pequeños patrones del suelo */

    ctx.fillStyle =
      "#789f53";


    for (
      let x = 0;
      x < WORLD_WIDTH;
      x += 70
    ) {

      for (
        let y = 0;
        y < WORLD_HEIGHT;
        y += 70
      ) {

        ctx.fillRect(
          x - camera.x,
          y - camera.y,
          5,
          5
        );

      }
    }

  }


  /* =========================================================
     CAMINOS
     ========================================================= */

  function drawPaths() {

    ctx.fillStyle =
      "#c9a66a";


    /* Camino principal */

    ctx.fillRect(
      -camera.x,
      960 - camera.y,
      WORLD_WIDTH,
      150
    );


    /* Camino hacia la casa */

    ctx.fillRect(
      1250 - camera.x,
      500 - camera.y,
      150,
      550
    );


    /* Camino hacia el lago */

    ctx.fillRect(
      1400 - camera.x,
      900 - camera.y,
      500,
      130
    );


    /* Bordes */

    ctx.fillStyle =
      "#b9945b";


    for (
      let x = 0;
      x < WORLD_WIDTH;
      x += 55
    ) {

      ctx.fillRect(
        x - camera.x,
        970 - camera.y,
        25,
        5
      );

    }

  }


  /* =========================================================
     LAGO
     ========================================================= */

  function drawLake() {

    ctx.fillStyle =
      "#5fa8c4";


    ctx.fillRect(
      1750 - camera.x,
      900 - camera.y,
      500,
      430
    );


    ctx.fillStyle =
      "#79bed3";


    for (
      let y = 930;
      y < 1300;
      y += 45
    ) {

      for (
        let x = 1780;
        x < 2200;
        x += 90
      ) {

        ctx.fillRect(
          x - camera.x,
          y - camera.y,
          35,
          5
        );

      }
    }

  }


  /* =========================================================
     ÁRBOLES
     ========================================================= */

  function drawTree(x, y) {

    /* Tronco */

    ctx.fillStyle =
      "#75472b";


    ctx.fillRect(
      x - camera.x + 28,
      y - camera.y + 45,
      44,
      65
    );


    /* Copa */

    ctx.fillStyle =
      "#315f3d";


    ctx.fillRect(
      x - camera.x,
      y - camera.y + 25,
      100,
      65
    );


    ctx.fillStyle =
      "#3f7747";


    ctx.fillRect(
      x - camera.x + 15,
      y - camera.y,
      70,
      80
    );


    /* Hojas claras */

    ctx.fillStyle =
      "#55894e";


    ctx.fillRect(
      x - camera.x + 30,
      y - camera.y + 10,
      35,
      30
    );

  }


  function drawTrees() {

    const trees = [

      [180, 250],
      [420, 330],
      [690, 190],

      [1100, 270],
      [1350, 180],

      [350, 1350],
      [800, 1250],

      [1300, 1300],
      [1550, 1150]

    ];


    for (
      const tree of trees
      ) {

      drawTree(
        tree[0],
        tree[1]
      );

    }

  }


  /* =========================================================
     CASA
     ========================================================= */

  function drawHouse() {

    const x =
      1550 - camera.x;

    const y =
      310 - camera.y;


    /* Pared */

    ctx.fillStyle =
      "#d9b58d";


    ctx.fillRect(
      x,
      y + 70,
      380,
      190
    );


    /* Techo */

    ctx.fillStyle =
      "#8d5261";


    ctx.beginPath();


    ctx.moveTo(
      x - 30,
      y + 75
    );


    ctx.lineTo(
      x + 190,
      y - 80
    );


    ctx.lineTo(
      x + 410,
      y + 75
    );


    ctx.closePath();

    ctx.fill();


    /* Puerta */

    ctx.fillStyle =
      "#70452f";


    ctx.fillRect(
      x + 165,
      y + 150,
      55,
      110

  /* =========================================================

  const inventoryBox =

   */

  const inventory = [];

       */

    } else {

      updateInteraction();

  /* =========================================================
     SISTEMA DE INTERACCIÓN REUTILIZABLE
     ========================================================= */

  const interactionBox =
    document.getElementById(
      "interaction"
    );


  const interactionText =
    document.getElementById(
      "interaction-text"
    );


  /*
   * Esta variable guarda cualquier cosa
   * con la que el jugador pueda interactuar.
   *
   * Puede ser:
   * - NPC
   * - objeto
   * - puerta
   * - cofre
   * - cartel
   * - foto
   * - portal
   * - etc.
   */

  let nearbyInteraction = null;


  let interactionShowingText =
    false;


  const interactionDistance = 110;


  /* =========================================================
     DISTANCIA ENTRE DOS ENTIDADES
     ========================================================= */

  function getEntityDistance(a, b) {

    const aCenterX =
      a.x +
      a.width / 2;


    const aCenterY =
      a.y +
      a.height / 2;


    const bCenterX =
      b.x +
      b.width / 2;


    const bCenterY =
      b.y +
      b.height / 2;


    const dx =
      aCenterX -
      bCenterX;


    const dy =
      aCenterY -
      bCenterY;


    return Math.sqrt(
      dx * dx +
      dy * dy
    );

  }


  /* =========================================================
     BUSCAR INTERACCIÓN MÁS CERCANA
     ========================================================= */

  function findNearbyInteraction() {

    let closestInteraction = null;


    let closestDistance =
      Infinity;


    /*
     * Buscamos entre todos los objetos.
     */

    for (
      const object of interactables
      ) {

      const distance =
        getEntityDistance(
          player,
          object
        );


      if (
        distance < closestDistance &&
        distance <= interactionDistance
      ) {

        closestDistance =
          distance;


        closestInteraction =
          object;

      }

    }


    /*
     * Buscamos también entre todos los NPCs.
     */

    for (
      const npc of npcs
      ) {

      const distance =
        getEntityDistance(
          player,
          npc
        );


      if (
        distance < closestDistance &&
        distance <= interactionDistance
      ) {

        closestDistance =
          distance;


        closestInteraction =
          npc;

      }

    }


    return closestInteraction;

  }


  /* =========================================================
     TEXTO DE INTERACCIÓN
     ========================================================= */

  function getInteractionPrompt(interaction) {

    if (!interaction) {
      return "";
    }


    if (
      interaction.type === "npc"
    ) {

      return "💗 E · Hablar";

    }


    return "💗 E · Interactuar";

  }


  /* =========================================================
     ACTUALIZAR INTERACCIÓN
     ========================================================= */

  function updateInteraction() {

    if (dialogueActive || inventoryOpen) {

      interactionBox.classList.remove(
        "visible"
      );

      return;

    }


    const newInteraction =
      findNearbyInteraction();


    /*
     * Si cambió el objetivo cercano,
     * reiniciamos el texto del objeto.
     */

    if (
      newInteraction !== nearbyInteraction
    ) {

      interactionShowingText =
        false;

    }


    nearbyInteraction =
      newInteraction;


    if (!nearbyInteraction) {

      interactionShowingText =
        false;


      interactionBox.classList.remove(
        "visible"
      );


      return;

    }


    /*
     * Si ya mostramos el texto de un objeto,
     * lo mantenemos visible.
     */

    if (
      interactionShowingText &&
      nearbyInteraction.type !== "npc"
    ) {

      interactionBox.classList.add(
        "visible"
      );


      return;

    }


    interactionText.textContent =
      getInteractionPrompt(
        nearbyInteraction
      );


    interactionBox.classList.add(
      "visible"
    );

  }


  /* =========================================================
     INTERACTUAR
     ========================================================= */

  function interact() {

    if (inventoryOpen) {
      return;
    }


    if (
      !nearbyInteraction
    ) {

      return;

    }


    /*
     * NPC
     */

    if (
      nearbyInteraction.type === "npc"
    ) {

      startDialogue(
        nearbyInteraction
      );


      return;

    }


    /*
     * Objeto con texto
     */

    if (
      nearbyInteraction.text
    ) {

      interactionText.textContent =
        nearbyInteraction.text;


      interactionShowingText =
        true;


      interactionBox.classList.add(
        "visible"
      );

    }

  }


  /* =========================================================
     SISTEMA DE DIÁLOGO
     ========================================================= */

  const dialogueBox =
    document.getElementById(
      "dialogue"
    );


  const dialogueName =
    document.getElementById(
      "dialogue-name"
    );


  const dialogueText =
    document.getElementById(
      "dialogue-text"
    );


  let dialogueActive =
    false;


  let currentNPC =
    null;


  let currentDialogueIndex =
    0;


  /* =========================================================
     INICIAR DIÁLOGO
     ========================================================= */

  function startDialogue(npc) {

    if (
      !npc ||
      !npc.dialogues ||
      npc.dialogues.length === 0
    ) {

      return;
    }


    dialogueActive =
      true;


    currentNPC =
      npc;


    currentDialogueIndex =
      0;


    keys.up = false;
    keys.down = false;
    keys.left = false;
    keys.right = false;


    interactionBox.classList.remove(
      "visible"
    );


    dialogueBox.classList.add(
      "visible"
    );


    showCurrentDialogue();

  }


  /* =========================================================
     MOSTRAR DIÁLOGO ACTUAL
     ========================================================= */

  function showCurrentDialogue() {

    if (!currentNPC) {

      return;
    }


    dialogueName.textContent =
      currentNPC.name;


    dialogueText.textContent =
      currentNPC.dialogues[
        currentDialogueIndex
        ];

  }


  /* =========================================================
     AVANZAR DIÁLOGO
     ========================================================= */

  function advanceDialogue() {

    if (!dialogueActive) {

      return;
    }


    currentDialogueIndex++;


    /*
     * ¿Terminó el diálogo?
     */

    if (
      currentDialogueIndex >=
      currentNPC.dialogues.length
    ) {

      closeDialogue();

      return;
    }


    showCurrentDialogue();

  }


  /* =========================================================
     CERRAR DIÁLOGO
     ========================================================= */

  function closeDialogue() {

    dialogueActive =
      false;


    currentNPC =
      null;


    currentDialogueIndex =
      0;


    dialogueBox.classList.remove(
      "visible"
    );


    /*
     * Permitimos que el sistema
     * vuelva a detectar objetos
     * y NPCs cercanos.
     */

    updateInteraction();

  }

  function gameLoop() {
