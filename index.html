    </button>

  </button>

<script>

  /* =========================================================
     CONFIGURACIÓN GENERAL
     ========================================================= */

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;


  /* =========================================================
     TAMAÑO DEL MUNDO
     ========================================================= */

  const WORLD_WIDTH = 2400;
  const WORLD_HEIGHT = 1600;

  let screenWidth = window.innerWidth;
  let screenHeight = window.innerHeight;


  function resizeCanvas() {

    screenWidth = window.innerWidth;
    screenHeight = window.innerHeight;

    canvas.width = screenWidth;
    canvas.height = screenHeight;

    ctx.imageSmoothingEnabled = false;
  }


  window.addEventListener("resize", resizeCanvas);

  resizeCanvas();


  /* =========================================================
     CÁMARA
     ========================================================= */

  const camera = {
    x: 0,
    y: 0
  };


  /* =========================================================
     PERSONAJE
     ========================================================= */

  const player = {

    x: 430,
    y: 1050,

    width: 38,
    height: 50,

    speed: 4,

    direction: "down",

    moving: false,

    animationTimer: 0,
    animationFrame: 0
  };


  /* =========================================================
     TECLAS
     ========================================================= */

  const keys = {

    up: false,
    down: false,
    left: false,
    right: false
  };


  function stopPlayerMovement() {

    keys.up = false;
    keys.down = false;
    keys.left = false;
    keys.right = false;

    player.moving = false;
  }


  window.addEventListener("keydown", function(event) {

    if (dialogueActive) {

      if (
        event.key.toLowerCase() === "e" ||
        event.key === " "
      ) {

        if (!event.repeat) {

          advanceDialogue();
        }

        event.preventDefault();
      }

      return;
    }


    /* =========================
       TECLA I · INVENTARIO
       ========================= */

    if (
      event.key.toLowerCase() === "i" &&
      !event.repeat
    ) {

      if (!itemDetailOpen) {
        toggleInventory();
      }

      event.preventDefault();

      return;
    }


    /*
     * Si el detalle de un objeto está abierto,
     * bloqueamos completamente el teclado.
     */

    if (itemDetailOpen) {

      if (
        event.key === "Escape" ||
        event.key.toLowerCase() === "e"
      ) {

        if (!event.repeat) {
          closeItemDetail();
        }

        event.preventDefault();

        return;
      }

      event.preventDefault();

      return;
    }


    /*
     * Si el inventario está abierto,
     * bloqueamos completamente el teclado.
     */

    if (inventoryOpen) {

      event.preventDefault();

      return;
    }


    if (
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ) {

      keys.up = true;

      event.preventDefault();
    }


    if (
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ) {

      keys.down = true;

      event.preventDefault();
    }


    if (
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a"
    ) {

      keys.left = true;

      event.preventDefault();
    }


    if (
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ) {

      keys.right = true;

      event.preventDefault();
    }


    /* =========================
       TECLA E
       ========================= */

    if (
      event.key.toLowerCase() === "e" &&
      !event.repeat
    ) {

      interact();
    }

  });


  window.addEventListener("keyup", function(event) {

    if (
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ) {

      keys.up = false;
    }


    if (
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ) {

      keys.down = false;
    }


    if (
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a"
    ) {

      keys.left = false;
    }


    if (
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ) {

      keys.right = false;
    }

  });


  /* =========================================================
     CONTROLES TÁCTILES
     ========================================================= */

  function setupTouchButton(id, direction) {

    const button =
      document.getElementById(id);


    button.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        if (
          !dialogueActive &&
          !inventoryOpen &&
          !itemDetailOpen
        ) {

          keys[direction] = true;
        }

      }
    );


    button.addEventListener(
      "pointerup",
      function(event) {

        event.preventDefault();

        keys[direction] = false;
      }
    );


    button.addEventListener(
      "pointercancel",
      function() {

        keys[direction] = false;
      }
    );


    button.addEventListener(
      "pointerleave",
      function() {

        keys[direction] = false;
      }
    );
  }


  setupTouchButton("up", "up");
  setupTouchButton("down", "down");
  setupTouchButton("left", "left");
  setupTouchButton("right", "right");


  document
    .getElementById("action-button")
    .addEventListener(
      "click",
      interact
    );


  /* =========================================================
     OBSTÁCULOS
     ========================================================= */

  const obstacles = [];


  function addObstacle(
    x,
    y,
    width,
    height
  ) {

    obstacles.push({
      x,
      y,
      width,
      height
    });
  }


  /* =========================
     CASA
     ========================= */

  addObstacle(
    1550,
    310,
    380,
    260
  );


  /* =========================
     LAGO
     ========================= */

  addObstacle(
    1750,
    900,
    500,
    430
  );


  /* =========================
     ÁRBOLES
     ========================= */

  addObstacle(180, 250, 100, 110);
  addObstacle(420, 330, 100, 110);
  addObstacle(690, 190, 100, 110);

  addObstacle(1100, 270, 100, 110);
  addObstacle(1350, 180, 100, 110);

  addObstacle(350, 1350, 100, 110);
  addObstacle(800, 1250, 100, 110);

  addObstacle(1300, 1300, 100, 110);
  addObstacle(1550, 1150, 100, 110);


  /* =========================================================
     OBJETOS INTERACTIVOS
     ========================================================= */

  const interactables = [

    {
      type: "object",

      id: "flower",

      x: 850,
      y: 820,

      width: 90,
      height: 80,

      collectible: true,

      item: {
        id: "flower",
        name: "Flor",
        icon: "🌸",
        description:
          "Una pequeña flor que encontraste durante tu aventura. Quizás algún día tenga un significado especial."
      },

      text:
        "🌸 Parece una flor especial... ¿quieres recogerla?"
    },


    /* =====================================================
       ALTAR DE LA FLOR · PASO 4.4
       ===================================================== */

    {
      type: "flower-spot",

      id: "flower-spot",

      x: 1050,
      y: 650,

      width: 100,
      height: 80,

      activated: false,

      text:
        "💗 Hay algo especial en este lugar... como si estuviera esperando algo."
    },


    {
      type: "object",

      id: "memory-1",

      x: 1500,
      y: 720,

      width: 90,
      height: 90,

      text:
        "💗 Aquí podremos colocar una foto o un recuerdo importante."
    },


    {
      type: "object",

      id: "memory-2",

      x: 2100,
      y: 500,

      width: 100,
      height: 100,

      text:
        "✨ Esta zona será importante más adelante..."
    }

  ];


  /* =========================================================
     NPC
     ========================================================= */

  const npcs = [

    {
      type: "npc",
      id: "test-npc",

      name: "???",

      x: 620,
      y: 1020,

      width: 38,
      height: 50,

      dialogues: [

        "Hola...",

        "Si estás viendo esto, significa que llegaste hasta aquí.",

        "Este lugar todavía está empezando a tomar forma.",

        "Pero algún día guardará nuestra historia completa. 💗"

      ]

    }

  ];


  /* =========================================================
     COLISIONES
     ========================================================= */

  function rectanglesCollide(a, b) {

    return (

      a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y

    );
  }


  function canMoveTo(x, y) {

    const futurePlayer = {

      x: x,
      y: y,

      width: player.width,
      height: player.height

    };


    if (x < 0) return false;

    if (y < 0) return false;


    if (
      x + player.width >
      WORLD_WIDTH
    ) {

      return false;
    }


    if (
      y + player.height >
      WORLD_HEIGHT
    ) {

      return false;
    }


    for (
      const obstacle of obstacles
      ) {

      if (
        rectanglesCollide(
          futurePlayer,
          obstacle
        )
      ) {

        return false;
      }

    }


    for (
      const npc of npcs
      ) {

      if (
        rectanglesCollide(
          futurePlayer,
          npc
        )
      ) {

        return false;
      }

    }


    return true;
  }


  /* =========================================================
     MOVIMIENTO
     ========================================================= */

  function updatePlayer() {

    if (
      dialogueActive ||
      inventoryOpen ||
      itemDetailOpen
    ) {

      player.moving = false;

      return;
    }


    let dx = 0;
    let dy = 0;


    if (keys.up) {

      dy -= 1;
    }


    if (keys.down) {

      dy += 1;
    }


    if (keys.left) {

      dx -= 1;
    }


    if (keys.right) {

      dx += 1;
    }


    player.moving =
      dx !== 0 ||
      dy !== 0;


    if (!player.moving) {

      return;
    }


    if (
      dx !== 0 &&
      dy !== 0
    ) {

      dx *= 0.707;
      dy *= 0.707;
    }


    if (dy < 0) {

      player.direction = "up";

    } else if (dy > 0) {

      player.direction = "down";

    } else if (dx < 0) {

      player.direction = "left";

    } else if (dx > 0) {

      player.direction = "right";
    }


    const newX =
      player.x +
      dx *
      player.speed;


    const newY =
      player.y +
      dy *
      player.speed;


    if (
      canMoveTo(
        newX,
        player.y
      )
    ) {

      player.x = newX;
    }


    if (
      canMoveTo(
        player.x,
        newY
      )
    ) {

      player.y = newY;
    }


    player.animationTimer++;


    if (
      player.animationTimer > 8
    ) {

      player.animationTimer = 0;

      player.animationFrame =
        player.animationFrame === 0
          ? 1
          : 0;
    }

  }


  /* =========================================================
     CÁMARA
     ========================================================= */

  function updateCamera() {

    camera.x =
      player.x +
      player.width / 2 -
      screenWidth / 2;


    camera.y =
      player.y +
      player.height / 2 -
      screenHeight / 2;


    camera.x =
      Math.max(
        0,
        Math.min(
          camera.x,
          WORLD_WIDTH -
          screenWidth
        )
      );


    camera.y =
      Math.max(
        0,
        Math.min(
          camera.y,
          WORLD_HEIGHT -
          screenHeight
        )
      );

  }


  /* =========================================================
     FONDO
     ========================================================= */

  function drawBackground() {

    ctx.fillStyle =

      const object of interactables

      /*
       * Si el objeto ya fue recogido,
       * no lo dibujamos.
       *
       * El altar no utiliza "collected",
       * por lo que seguirá apareciendo.
       */

      if (object.collected) {
        continue;
      }


      /*
       * ALTAR DE LA FLOR
       */

      if (
        object.type === "flower-spot"
      ) {

        drawFlowerSpot(
          object
        );

        continue;
      }


      /*
       * La flor recogible tiene
       * su propio diseño visual.
       */

      if (
        object.collectible &&
        object.item &&
        object.item.id === "flower"
      ) {

        drawCollectibleFlower(
          object
        );

        continue;
      }


      const x =
        object.x - camera.x;

      const y =
        object.y - camera.y;


      ctx.fillStyle =
        "#8d5b36";


      ctx.fillRect(
        x,

        object.height

        "#d7a55e";

  /* =========================================================

     ========================================================= */

  const inventoryBox =
    document.getElementById("inventory");

  const inventoryEmpty =
    document.getElementById("inventory-empty");

  const inventoryItems =
    document.getElementById("inventory-items");

  let inventoryOpen = false;


  /*
   * Aquí se guardarán los objetos
   * que el jugador haya recogido.
   */

  const inventory = [];


  /* =========================================================
     DETALLE DEL OBJETO
     ========================================================= */

  const itemDetail =
    document.getElementById(
      "item-detail"
    );

  const itemDetailIcon =
    document.getElementById(
      "item-detail-icon"
    );

  const itemDetailName =
    document.getElementById(
      "item-detail-name"
    );

  const itemDetailDescription =
    document.getElementById(
      "item-detail-description"
    );

  const itemDetailClose =
    document.getElementById(
      "item-detail-close"
    );

  let itemDetailOpen = false;


  /* =========================================================
     ABRIR DETALLE DEL OBJETO
     ========================================================= */

  function openItemDetail(item) {

    if (!item) {
      return;
    }


    itemDetailIcon.textContent =
      item.icon;


    itemDetailName.textContent =
      item.name;


    itemDetailDescription.textContent =
      item.description;


    itemDetailOpen = true;


    stopPlayerMovement();


    itemDetail.classList.add(
      "visible"
    );

  }


  /* =========================================================
     CERRAR DETALLE DEL OBJETO
     ========================================================= */

  function closeItemDetail() {

    itemDetailOpen = false;


    itemDetail.classList.remove(
      "visible"
    );


    stopPlayerMovement();

  }


  itemDetailClose.addEventListener(
    "click",
    function() {

      closeItemDetail();

    }
  );


  /* =========================================================
     ACTUALIZAR VISUALMENTE EL INVENTARIO
     ========================================================= */

  function updateInventoryUI() {

    /*
     * Limpiamos la lista actual.
     */

    inventoryItems.innerHTML = "";


    /*
     * Si no tenemos objetos,
     * mostramos el mensaje de inventario vacío.
     */

    if (inventory.length === 0) {

      inventoryEmpty.style.display =
        "block";

      return;
    }


    /*
     * Si tenemos objetos,
     * ocultamos el mensaje vacío.
     */

    inventoryEmpty.style.display =
      "none";


    /*
     * Creamos una tarjeta
     * para cada objeto.
     */

    for (
      const item of inventory
      ) {

      const itemElement =
        document.createElement("div");


      itemElement.className =
        "inventory-item";


      itemElement.innerHTML = `

        <div class="inventory-item-icon">
          ${item.icon}
        </div>

        <div class="inventory-item-name">
          ${item.name}
        </div>

        <div class="inventory-item-description">
          ${item.description}
        </div>

      `;


      /*
       * Al hacer clic en el objeto,
       * abrimos su información detallada.
       */

      itemElement.addEventListener(
        "click",
        function() {

          openItemDetail(item);

        }
      );


      inventoryItems.appendChild(
        itemElement
      );

    }

  }


  /* =========================================================
     AÑADIR OBJETO AL INVENTARIO
     ========================================================= */

  function addToInventory(item) {

    if (!item) {
      return false;
    }


    /*
     * Evitamos duplicados.
     */

    const alreadyHasItem =
      inventory.some(
        inventoryItem =>
          inventoryItem.id === item.id
      );


    if (alreadyHasItem) {

      return false;
    }


    inventory.push(item);


    updateInventoryUI();


    return true;
  }


  /* =========================================================
     ELIMINAR OBJETO DEL INVENTARIO
     ========================================================= */

  function removeFromInventory(itemId) {

    if (!itemId) {
      return false;
    }


    const itemIndex =
      inventory.findIndex(
        item =>
          item.id === itemId
      );


    if (itemIndex === -1) {

      return false;
    }


    inventory.splice(
      itemIndex,
      1
    );


    updateInventoryUI();


    return true;
  }


  /* =========================================================
     RECOGER OBJETO
     ========================================================= */

  function collectObject(object) {

    if (
      !object ||
      !object.collectible ||
      object.collected
    ) {

      return;
    }


    /*
     * Intentamos añadir el objeto
     * al inventario.
     */

    const added =
      addToInventory(
        object.item
      );


    if (!added) {
      return;
    }


    /*
     * Marcamos el objeto
     * como recogido.
     */

    object.collected = true;


    /*
     * Dejamos de considerarlo
     * como objeto cercano.
     */

    nearbyInteraction = null;

    interactionShowingText =
      false;


    interactionBox.classList.remove(
      "visible"
    );


    /*
     * Mostramos un pequeño mensaje
     * de confirmación.
     */

    interactionText.textContent =
      `${object.item.icon} Has obtenido: ${object.item.name}`;


    interactionBox.classList.add(
      "visible"
    );


    /*
     * Después de un momento,
     * ocultamos el mensaje.
     */

    setTimeout(
      function() {

        if (
          !dialogueActive &&
          !inventoryOpen &&
          !itemDetailOpen
        ) {

          interactionBox.classList.remove(
            "visible"
          );

        }

      },
      1800
    );

  }


  function toggleInventory() {

    /*
     * Si estamos viendo el detalle
     * de un objeto, no abrimos/cerramos
     * el inventario desde aquí.
     */

    if (itemDetailOpen) {
      return;
    }


    inventoryOpen = !inventoryOpen;


    if (inventoryOpen) {

      stopPlayerMovement();

      /*
       * Nos aseguramos de que el
       * inventario tenga la información actual.
       */

      updateInventoryUI();


      inventoryBox.classList.add(
        "visible"
      );


      interactionBox.classList.remove(
        "visible"
      );

    } else {

      inventoryBox.classList.remove(
        "visible"
      );


      updateInteraction();

    }

  }


  /* =========================================================
     SISTEMA DE INTERACCIÓN REUTILIZABLE
     ========================================================= */

  const interactionBox =
    document.getElementById(
      "interaction"
    );


  const interactionText =
    document.getElementById(
      "interaction-text"
    );


  let nearbyInteraction = null;

  let interactionShowingText =
    false;


  const interactionDistance = 110;


  /* =========================================================
     DISTANCIA ENTRE DOS ENTIDADES
     ========================================================= */

  function getEntityDistance(a, b) {

    const aCenterX =
      a.x +
      a.width / 2;


    const aCenterY =
      a.y +
      a.height / 2;


    const bCenterX =
      b.x +
      b.width / 2;


    const bCenterY =
      b.y +
      b.height / 2;


    const dx =
      aCenterX -
      bCenterX;


    const dy =
      aCenterY -
      bCenterY;


    return Math.sqrt(
      dx * dx +
      dy * dy
    );

  }


  /* =========================================================
     BUSCAR INTERACCIÓN MÁS CERCANA
     ========================================================= */

  function findNearbyInteraction() {

    let closestInteraction = null;

    let closestDistance =
      Infinity;


    for (
      const object of interactables
      ) {

      /*
       * Los objetos recogidos ya no
       * pueden ser interactuados.
       */

      if (object.collected) {
        continue;
      }


      const distance =
        getEntityDistance(
          player,
          object
        );


      if (
        distance < closestDistance &&
        distance <= interactionDistance
      ) {

        closestDistance =
          distance;


        closestInteraction =
          object;

      }

    }


    for (
      const npc of npcs
      ) {

      const distance =
        getEntityDistance(
          player,
          npc
        );


      if (
        distance < closestDistance &&
        distance <= interactionDistance
      ) {

        closestDistance =
          distance;


        closestInteraction =
          npc;

      }

    }


    return closestInteraction;

  }


  /* =========================================================
     TEXTO DE INTERACCIÓN
     ========================================================= */

  function getInteractionPrompt(interaction) {

    if (!interaction) {
      return "";
    }


    if (
      interaction.type === "npc"
    ) {

      return "💗 E · Hablar";

    }


    /* =====================================================
       ALTAR DE LA FLOR
       ===================================================== */

    if (
      interaction.type === "flower-spot"
    ) {

      /*
       * Si la flor ya fue colocada,
       * el lugar puede examinarse.
       */

      if (
        interaction.activated
      ) {

        return "✨ E · Examinar";

      }


      /*
       * Comprobamos si el jugador
       * tiene la flor en el inventario.
       */

      const hasFlower =
        inventory.some(
          item =>
            item.id === "flower"
        );


      if (hasFlower) {

        return "🌸 E · Colocar flor";

      }


      return "💗 Parece que falta algo aquí...";

    }


    if (
      interaction.collectible
    ) {

      return `${interaction.item.icon} E · Recoger`;

    }


    return "💗 E · Interactuar";

  }


  /* =========================================================
     ACTUALIZAR INTERACCIÓN
     ========================================================= */

  function updateInteraction() {

    if (
      dialogueActive ||
      inventoryOpen ||
      itemDetailOpen
    ) {

      interactionBox.classList.remove(
        "visible"
      );

      return;

    }


    const newInteraction =
      findNearbyInteraction();


    if (
      newInteraction !== nearbyInteraction
    ) {

      interactionShowingText =
        false;

    }


    nearbyInteraction =
      newInteraction;


    if (!nearbyInteraction) {

      interactionShowingText =
        false;


      interactionBox.classList.remove(
        "visible"
      );


      return;

    }


    if (
      interactionShowingText &&
      nearbyInteraction.type !== "npc"
    ) {

      interactionBox.classList.add(
        "visible"
      );


      return;

    }


    interactionText.textContent =
      getInteractionPrompt(
        nearbyInteraction
      );


    interactionBox.classList.add(
      "visible"
    );

  }


  /* =========================================================
     INTERACTUAR
     ========================================================= */

  function interact() {

    if (
      inventoryOpen ||
      itemDetailOpen
    ) {

      return;
    }


    if (
      !nearbyInteraction
    ) {

      return;
    }


    /*
     * NPC
     */

    if (
      nearbyInteraction.type === "npc"
    ) {

      startDialogue(
        nearbyInteraction
      );


      return;

    }


    /* =====================================================
       ALTAR DE LA FLOR · PASO 4.4
       ===================================================== */

    if (
      nearbyInteraction.type === "flower-spot"
    ) {

      /*
       * Si ya fue activado,
       * mostramos su mensaje especial.
       */

      if (
        nearbyInteraction.activated
      ) {

        interactionText.textContent =
          "✨ La flor permanece aquí... como si guardara un recuerdo.";

        interactionShowingText =
          true;

        interactionBox.classList.add(
          "visible"
        );

        return;
      }


      /*
       * Buscamos la flor en el inventario.
       */

      const hasFlower =
        inventory.some(
          item =>
            item.id === "flower"
        );


      /*
       * Si todavía no tenemos la flor,
       * mostramos el mensaje del lugar.
       */

      if (!hasFlower) {

        interactionText.textContent =
          nearbyInteraction.text;

        interactionShowingText =
          true;

        interactionBox.classList.add(
          "visible"
        );

        return;
      }


      /*
       * Intentamos retirar la flor
       * del inventario.
       */

      const removed =
        removeFromInventory(
          "flower"
        );


      if (!removed) {

        return;
      }


      /*
       * Activamos permanentemente
       * el pedestal.
       */

      nearbyInteraction.activated =
        true;


      /*
       * Mostramos el primer mensaje
       * narrativo del lugar.
       */

      interactionText.textContent =
        "🌸 Has colocado la flor... Por alguna razón, este lugar se siente diferente.";

      interactionShowingText =
        true;


      interactionBox.classList.add(
        "visible"
      );


      return;
    }


    /*
     * OBJETO RECOGIBLE
     */

    if (
      nearbyInteraction.collectible
    ) {

      collectObject(
        nearbyInteraction
      );


      return;
    }


    /*
     * Objeto normal con texto
     */

    if (
      nearbyInteraction.text
    ) {

      interactionText.textContent =
        nearbyInteraction.text;


      interactionShowingText =
        true;


      interactionBox.classList.add(
        "visible"
      );

    }

  }


  /* =========================================================
     SISTEMA DE DIÁLOGO
     ========================================================= */

  const dialogueBox =
    document.getElementById(
      "dialogue"
    );


  const dialogueName =
    document.getElementById(
      "dialogue-name"
    );


  const dialogueText =
    document.getElementById(
      "dialogue-text"
    );


  let dialogueActive =
    false;


  let currentNPC =
    null;


  let currentDialogueIndex =
    0;


  /* =========================================================
     INICIAR DIÁLOGO
     ========================================================= */

  function startDialogue(npc) {

    if (
      !npc ||
      !npc.dialogues ||
      npc.dialogues.length === 0
    ) {

      return;
    }


    dialogueActive =
      true;


    currentNPC =
      npc;


    currentDialogueIndex =
      0;


    keys.up = false;
    keys.down = false;
    keys.left = false;
    keys.right = false;


    interactionBox.classList.remove(
      "visible"
    );


    dialogueBox.classList.add(
      "visible"
    );


    showCurrentDialogue();

  }


  /* =========================================================
     MOSTRAR DIÁLOGO ACTUAL
     ========================================================= */

  function showCurrentDialogue() {

    if (!currentNPC) {

      return;
    }


    dialogueName.textContent =
      currentNPC.name;


    dialogueText.textContent =
      currentNPC.dialogues[
        currentDialogueIndex
        ];

  }


  /* =========================================================
     AVANZAR DIÁLOGO
     ========================================================= */

  function advanceDialogue() {

    if (!dialogueActive) {

      return;
    }


    currentDialogueIndex++;


    if (
      currentDialogueIndex >=
      currentNPC.dialogues.length
    ) {

      closeDialogue();

      return;
    }


    showCurrentDialogue();

  }


  /* =========================================================
     CERRAR DIÁLOGO
     ========================================================= */

  function closeDialogue() {

    dialogueActive =
      false;


    currentNPC =
      null;


    currentDialogueIndex =
      0;


    dialogueBox.classList.remove(
      "visible"
    );


    updateInteraction();

  }


  /* =========================================================
     DIBUJAR TODO
     ========================================================= */

  function draw() {

    drawBackground();

    drawGround();

    drawPaths();

    drawLake();

    drawTrees();

    drawHouse();

    drawFlowers();

    drawStartSign();

    drawInteractables();

    drawPortal();

    drawNPCs();

    drawPlayer();

  }


  /* =========================================================
     BUCLE PRINCIPAL
     ========================================================= */

  function gameLoop() {

    updatePlayer();

    updateCamera();

    updateInteraction();

    draw();

    requestAnimationFrame(
      gameLoop
    );

  }


  /* =========================================================
     INICIAR JUEGO
     ========================================================= */

  gameLoop();

</script>
